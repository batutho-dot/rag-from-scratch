name: verify

# Offline checks on every push: no API key, no secrets, no paid calls.
# The three EU texts are downloaded from EUR-Lex when the runner is allowed to (see below).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Cache the EUR-Lex texts
        uses: actions/cache@v4
        with:
          path: data/raw
          key: eurlex-${{ hashFiles('rag/sources.py') }}
      - run: pip install -r requirements.txt
      # EUR-Lex answers GitHub's runners with an empty page, so the real run on the law
      # texts cannot happen here. verify.py then says "NOT RUN" instead of failing; the
      # offline steps (compile, units, questions) still run. On a normal machine,
      # `python verify.py` without the flag runs everything.
      - run: python verify.py --allow-no-source
